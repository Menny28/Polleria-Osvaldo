backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "sito"
    label: "Contenuti del sito"
    files:
      - name: "contenuti"
        label: "Piatto del giorno e avvisi"
        file: "data/site-data.json"
        fields:
          - label: "Piatto del giorno"
            name: "piattoDelGiorno"
            widget: "object"
            fields:
              - { label: "Mostra sul sito", name: "attivo", widget: "boolean", default: false }
              - { label: "Nome del piatto", name: "nome", widget: "string", required: false }
              - { label: "Descrizione breve", name: "descrizione", widget: "text", required: false }
          - label: "Avviso speciale"
            name: "avviso"
            widget: "object"
            fields:
              - { label: "Mostra sul sito", name: "attivo", widget: "boolean", default: false }
              - { label: "Testo dell'avviso", name: "testo", widget: "string", required: false, hint: "Es. Chiuso per ferie dal 10 al 20 agosto" }
